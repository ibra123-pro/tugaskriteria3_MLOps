name: UMKM_Pondok_Gede_Modelling_Pipeline_CICD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  MLFLOW_EXPERIMENT_NAME: "UMKM_Pondok_Gede_Modelling"
  MLFLOW_TRACKING_URI: "file://${{ github.workspace }}/mlruns"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Ambil kode dari repositori
      - name: Run action/Checkout@v3
        uses: actions/checkout@v3

      # 2. Siapkan Python 3.12.7
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: |
          echo "Pipeline Ready"

      # 3. Instal dependensi pendukung di server
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn==1.5.2 openpyxl mlflow==2.19.0

      # 4. Jalankan MLflow Project di dalam sub-folder MLProject
      - name: Run MLflow Project
        run: |
          mlflow run ./MLProject --env-manager=local

      # 5. Amankan dan Simpan Hasil Log Eksperimen (mlruns) ke GitHub
      - name: Save mlruns to repo
        env:
          # PERBAIKAN: Huruf besar disamakan dengan Repository Secrets kamu
          GIT_NAME: ${{ secrets.USERNAME }}
          GIT_EMAIL: ${{ secrets.EMAIL }}
        run: |
          git config --global user.name "${GIT_NAME:-ibra123-pro}"
          git config --global user.email "${GIT_EMAIL:-achmadibrahim21@gmail.com}"

          git fetch origin main

          git checkout main
          
          git add -A
          
          # Periksa status perubahan untuk commit
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Save mlruns from CI modelling run [skip ci]"
            git pull origin main --rebase -X theirs
            git push origin main
          else
            echo "No changes to commit"
          fi

      # 6. Login ke Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # 7. Build dan Push Docker Image (SUDAH DISESUAIKAN STRUKTUR BARU)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          # PERBAIKAN: Diarahkan ke ./MLProject karena Dockerfile sekarang ada di sana
          context: ./MLProject
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/umkm-pondokgede-model:latest
