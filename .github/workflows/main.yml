name: UMKM_Pondok_Gede_Modelling_Pipeline_CICD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  MLFLOW_EXPERIMENT_NAME: "UMKM_Pondok_Gede_Modelling"
  MLFLOW_TRACKING_URI: "file://${{ github.workspace }}/mlruns"
  
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Ambil kode dari repositori
      - name: Run action/Checkout@v3
        uses: actions/checkout@v3

      # 2. Siapkan Python 3.12.7 (Sudah diperbaiki tanda strip-nya agar tidak error)
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: |
          echo $CSV_URL
      # 3. Instal dependensi pendukung di server
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn==1.5.2 openpyxl mlflow==2.19.0
      # 4. Jalankan MLflow Project di dalam sub-folder pilihanmu
      - name: Run MLflow Project
        run: |
          mlflow run Workflow-CI/MLProject/ --env-manager=local
      # 5. Amankan dan Simpan Hasil Log Eksperimen (mlruns) ke GitHub
      - name: Get latest MLflow run_id
        env:
          GIT_NAME: ${{ secrets.username }}
          GIT_EMAIL: ${{ secrets.email }}
        run: |
          git config --global user.name "${GIT_NAME:-ibra123-pro}"
          git config --global user.email "${GIT_EMAIL:-achmadibrahim21@gmail.com}"
          
          if [ -d "mlruns" ]; then
            git add -f mlruns/
          fi
          
          # Periksa status perubahan untuk commit
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Save mlruns from CI modelling run [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit"
          fi
      # 6. Login ke Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # 7. Build dan Push Docker Image menggunakan Dockerfile di dalam sub-folder kamu
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./Workflow-CI/MLProject/Baseline_Model_CICD
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/umkm-pondokgede-model:latest
